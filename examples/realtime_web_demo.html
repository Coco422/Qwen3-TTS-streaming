<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qwen3-TTS Realtime</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7f5;
      --ink: #171717;
      --muted: #64645f;
      --line: #d8d8d2;
      --panel: #ffffff;
      --accent: #0f766e;
      --warn: #a16207;
      --bad: #b42318;
      --soft: #edf7f5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    main {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.9);
      position: sticky;
      top: 0;
      z-index: 5;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--warn);
    }

    .dot.on {
      background: var(--accent);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(300px, 420px) minmax(0, 1fr);
      min-height: 0;
    }

    aside {
      padding: 18px;
      border-right: 1px solid var(--line);
      background: var(--panel);
      overflow: auto;
    }

    section {
      padding: 18px;
      overflow: auto;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 10px 11px;
      font: inherit;
      font-size: 14px;
      outline: none;
    }

    textarea {
      min-height: 116px;
      resize: vertical;
      line-height: 1.45;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--soft);
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 9px 12px;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.danger {
      color: var(--bad);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .meters {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .metric {
      border-bottom: 1px solid var(--line);
      padding: 0 0 10px;
    }

    .metric strong {
      display: block;
      font-size: 20px;
      font-weight: 750;
    }

    .metric span {
      font-size: 12px;
      color: var(--muted);
    }

    .transcript,
    .events {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      min-height: 160px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .events {
      margin-top: 14px;
      min-height: 220px;
      max-height: 38vh;
      overflow: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      color: #2f3430;
    }

    @media (max-width: 820px) {
      .workspace {
        grid-template-columns: 1fr;
      }

      aside {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .meters {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Qwen3-TTS Realtime</h1>
      <div class="status"><span id="dot" class="dot"></span><span id="status">disconnected</span></div>
    </header>

    <div class="workspace">
      <aside>
        <label for="speaker">Speaker</label>
        <input id="speaker" value="Vivian">

        <div class="grid2">
          <div>
            <label for="language">Language</label>
            <input id="language" value="Auto">
          </div>
          <div>
            <label for="holdback">Holdback</label>
            <input id="holdback" type="number" min="0" max="8" value="2">
          </div>
        </div>

        <label for="manualText">Manual Text</label>
        <textarea id="manualText">你好，这是一个直接把文本流追加进 Qwen3-TTS 的实时合成测试。</textarea>

        <div class="grid2">
          <div>
            <label for="delay">Delta Delay</label>
            <input id="delay" type="number" min="0" value="25">
          </div>
          <div>
            <label for="finishMode">Finish</label>
            <select id="finishMode">
              <option value="auto">Auto</option>
              <option value="manual">Manual</option>
            </select>
          </div>
        </div>

        <div class="actions">
          <button id="connect" class="primary">Connect</button>
          <button id="streamManual">Stream Text</button>
          <button id="finish">Finish</button>
          <button id="clear">Clear</button>
        </div>

        <label for="prompt">LLM Prompt</label>
        <textarea id="prompt">请用一句自然的中文介绍实时语音合成为什么要避免按句切分。</textarea>

        <div class="actions">
          <button id="streamLlm">Stream LLM</button>
        </div>
      </aside>

      <section>
        <div class="meters">
          <div class="metric"><strong id="chunks">0</strong><span>audio chunks</span></div>
          <div class="metric"><strong id="firstMs">-</strong><span>first audio ms</span></div>
          <div class="metric"><strong id="queueMs">0</strong><span>queued audio ms</span></div>
        </div>

        <div id="transcript" class="transcript"></div>
        <div id="events" class="events"></div>
      </section>
    </div>
  </main>

  <script>
    let ws = null;
    let audioCtx = null;
    let node = null;
    let queue = [];
    let queueOffset = 0;
    let chunkCount = 0;
    let queuedSamples = 0;

    const $ = (id) => document.getElementById(id);

    function setStatus(text, on = false) {
      $("status").textContent = text;
      $("dot").classList.toggle("on", on);
    }

    function log(event) {
      const line = typeof event === "string" ? event : JSON.stringify(event);
      $("events").textContent += line + "\n";
      $("events").scrollTop = $("events").scrollHeight;
    }

    function updateMeters(firstMs = null) {
      $("chunks").textContent = String(chunkCount);
      $("queueMs").textContent = audioCtx ? String(Math.round(queuedSamples / audioCtx.sampleRate * 1000)) : "0";
      if (firstMs !== null) $("firstMs").textContent = String(firstMs);
    }

    function ensureAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
      node = audioCtx.createScriptProcessor(4096, 0, 1);
      node.onaudioprocess = (event) => {
        const out = event.outputBuffer.getChannelData(0);
        let written = 0;
        while (written < out.length) {
          if (!queue.length) {
            out.fill(0, written);
            break;
          }
          const head = queue[0];
          const available = head.length - queueOffset;
          const take = Math.min(available, out.length - written);
          out.set(head.subarray(queueOffset, queueOffset + take), written);
          queueOffset += take;
          written += take;
          queuedSamples -= take;
          if (queueOffset >= head.length) {
            queue.shift();
            queueOffset = 0;
          }
        }
        updateMeters();
      };
      node.connect(audioCtx.destination);
    }

    function b64ToFloat32(b64) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new Float32Array(bytes.buffer);
    }

    function resample(input, inRate, outRate) {
      if (!inRate || inRate === outRate) return input;
      const ratio = outRate / inRate;
      const output = new Float32Array(Math.max(1, Math.round(input.length * ratio)));
      for (let i = 0; i < output.length; i++) {
        const pos = i / ratio;
        const left = Math.floor(pos);
        const right = Math.min(input.length - 1, left + 1);
        const frac = pos - left;
        output[i] = input[left] * (1 - frac) + input[right] * frac;
      }
      return output;
    }

    function send(event) {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        log("websocket is not connected");
        return false;
      }
      ws.send(JSON.stringify(event));
      return true;
    }

    function sessionUpdate() {
      return {
        type: "session.update",
        session: {
          speaker: $("speaker").value.trim() || "Vivian",
          language: $("language").value.trim() || "Auto",
          stable_holdback_tokens: Number($("holdback").value || 2)
        }
      };
    }

    async function connect() {
      if (ws && ws.readyState === WebSocket.OPEN) return;
      ensureAudio();
      await audioCtx.resume();
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(`${protocol}//${location.host}/v1/realtime/tts`);
      ws.onopen = () => {
        setStatus("connected", true);
        send(sessionUpdate());
      };
      ws.onclose = () => setStatus("disconnected", false);
      ws.onerror = () => setStatus("error", false);
      ws.onmessage = (message) => {
        const event = JSON.parse(message.data);
        if (event.type !== "response.audio.delta") log(event);
        if (event.type === "response.text.delta") {
          $("transcript").textContent += event.delta;
        }
        if (event.type === "input_text_buffer.appended") {
          return;
        }
        if (event.type === "response.audio.delta") {
          ensureAudio();
          let pcm = b64ToFloat32(event.delta);
          pcm = resample(pcm, event.sample_rate, audioCtx.sampleRate);
          queue.push(pcm);
          queuedSamples += pcm.length;
          chunkCount += 1;
          updateMeters(event.first_audio_ms ?? null);
        }
        if (event.type === "error") {
          setStatus(event.code || "error", false);
        }
        if (event.type === "session.finished") {
          setStatus("finished", false);
          ws.close();
          ws = null;
        }
      };
    }

    async function streamManual() {
      await connect();
      $("transcript").textContent = "";
      send(sessionUpdate());
      const text = $("manualText").value;
      const delay = Number($("delay").value || 0);
      for (const char of text) {
        $("transcript").textContent += char;
        send({ type: "input_text_buffer.append", text: char });
        if (delay > 0) await new Promise((resolve) => setTimeout(resolve, delay));
      }
      if ($("finishMode").value === "auto") send({ type: "session.finish" });
    }

    async function streamLlm() {
      await connect();
      $("transcript").textContent = "";
      send(sessionUpdate());
      send({ type: "llm.sse.start", prompt: $("prompt").value });
    }

    function clearAll() {
      queue = [];
      queueOffset = 0;
      queuedSamples = 0;
      chunkCount = 0;
      $("transcript").textContent = "";
      $("events").textContent = "";
      updateMeters("-");
      $("firstMs").textContent = "-";
    }

    $("connect").addEventListener("click", connect);
    $("streamManual").addEventListener("click", streamManual);
    $("streamLlm").addEventListener("click", streamLlm);
    $("finish").addEventListener("click", () => send({ type: "session.finish" }));
    $("clear").addEventListener("click", clearAll);
  </script>
</body>
</html>
